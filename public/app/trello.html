<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看板 · Trello-style Board</title>
<style>
/* ========== 防御性底模 ========== */
*, *::before, *::after { box-sizing: border-box; }
img, video { max-width: 100%; height: auto; display: block; }
body { overflow-wrap: break-word; }

/* ========== CSS 变量 / 主题 ========== */
:root {
  --bg-grad-1: #667eea;
  --bg-grad-2: #764ba2;
  --bg-grad-3: #f093fb;
  --surface: rgba(255, 255, 255, 0.72);
  --surface-strong: rgba(255, 255, 255, 0.92);
  --surface-hover: rgba(255, 255, 255, 0.85);
  --list-bg: rgba(244, 245, 247, 0.85);
  --card-bg: #ffffff;
  --card-hover: #f7f8fa;
  --text: #1f2328;
  --text-muted: #6b7280;
  --text-subtle: #9ca3af;
  --border: rgba(0, 0, 0, 0.06);
  --border-strong: rgba(0, 0, 0, 0.1);
  --primary: #5b6cff;
  --primary-hover: #4a5bef;
  --danger: #ef4444;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.12), 0 8px 10px -6px rgba(0,0,0,0.08);
  --shadow-xl: 0 20px 40px -10px rgba(0,0,0,0.18), 0 10px 20px -8px rgba(0,0,0,0.12);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --list-width: 280px;
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-base: 240ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 360ms cubic-bezier(0.4, 0, 0.2, 1);

  /* 标签色 */
  --label-red: #ef4444;
  --label-orange: #f97316;
  --label-yellow: #eab308;
  --label-green: #22c55e;
  --label-blue: #3b82f6;
  --label-purple: #a855f7;
  --label-pink: #ec4899;
  --label-teal: #14b8a6;
}

[data-theme="dark"] {
  --surface: rgba(30, 32, 40, 0.72);
  --surface-strong: rgba(30, 32, 40, 0.92);
  --surface-hover: rgba(45, 48, 60, 0.85);
  --list-bg: rgba(40, 43, 54, 0.85);
  --card-bg: #2a2d3a;
  --card-hover: #343849;
  --text: #e5e7eb;
  --text-muted: #9ca3af;
  --text-subtle: #6b7280;
  --border: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.1);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -2px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.4);
  --shadow-xl: 0 20px 40px -10px rgba(0,0,0,0.6), 0 10px 20px -8px rgba(0,0,0,0.5);
}

/* ========== 全局样式 ========== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background:
    radial-gradient(ellipse at 20% 10%, var(--bg-grad-1) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, var(--bg-grad-2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, var(--bg-grad-3) 0%, transparent 60%),
    linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  background-attachment: fixed;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  opacity: 0.04;
  pointer-events: none;
  z-index: 0;
}

/* ========== 顶部栏 ========== */
.board-header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.board-title-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.board-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(99,102,241,0.16), rgba(34,211,238,0.16));
  border: 1px solid rgba(140,160,200,0.28);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.board-icon svg {
  width: 22px;
  height: 22px;
}

.board-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--text);
}

.board-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}

.board-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.title-edit-btn {
  width: 26px;
  height: 26px;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.title-edit-btn:hover {
  background: rgba(0,0,0,0.06);
  color: var(--text);
}

.title-edit-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.board-title-input {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  border: 2px solid var(--primary);
  border-radius: var(--radius-sm);
  background: var(--card-bg);
  outline: none;
  font-family: inherit;
  padding: 2px 8px;
  width: 240px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface-strong);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
}

.icon-btn:hover {
  background: var(--surface-hover);
  color: var(--text);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.icon-btn svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.sync-status {
  font-size: 12px;
  color: var(--text-muted);
  padding: 0 6px;
  user-select: none;
  white-space: nowrap;
}

/* ========== 看板主体 ========== */
.board-container {
  position: relative;
  z-index: 5;
  height: calc(100vh - 69px);
  overflow-x: auto;
  overflow-y: hidden;
  padding: 20px;
  scroll-behavior: smooth;
  cursor: grab;
}

.board-container.grabbing {
  cursor: grabbing;
  scroll-behavior: auto;
}

.board-container::-webkit-scrollbar {
  height: 10px;
}
.board-container::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.1);
  border-radius: 5px;
}
.board-container::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.3);
  border-radius: 5px;
}
.board-container::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.5);
}

.board-content {
  display: flex;
  gap: 16px;
  height: 100%;
  align-items: flex-start;
  padding-bottom: 20px;
  min-width: min-content;
}

/* ========== 列表 ========== */
.list {
  flex: 0 0 var(--list-width);
  width: var(--list-width);
  max-height: 100%;
  background: var(--list-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: transform var(--transition-base), box-shadow var(--transition-base), opacity var(--transition-base);
  position: relative;
}

.list.dragging-list {
  opacity: 0.5;
  transform: scale(0.98);
}

.list.drag-over-left::before,
.list.drag-over-right::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--primary);
  border-radius: 2px;
  z-index: 10;
}
.list.drag-over-left::before { left: -8px; }
.list.drag-over-right::after { right: -8px; }

.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 14px 10px;
  cursor: grab;
  user-select: none;
}

.list-header:active { cursor: grabbing; }

.list-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
  min-width: 0;
  margin-right: 8px;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  transition: background var(--transition-fast);
  cursor: text;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.list-title:hover {
  background: rgba(0,0,0,0.05);
}

.list-title-input {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  width: 100%;
  padding: 4px 6px;
  border: 2px solid var(--primary);
  border-radius: var(--radius-sm);
  background: var(--card-bg);
  outline: none;
  font-family: inherit;
}

.list-count {
  font-size: 12px;
  color: var(--text-subtle);
  background: rgba(0,0,0,0.06);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
  min-width: 24px;
  text-align: center;
}

.list-menu-btn {
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  cursor: pointer;
  color: var(--text-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--transition-fast);
  flex-shrink: 0;
  margin-left: 8px;
}

.list-menu-btn:hover {
  background: transparent;
  color: var(--danger);
}

.list-menu-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

/* 卡片容器 */
.cards-container {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 10px;
  scroll-behavior: smooth;
}

.cards-container::-webkit-scrollbar {
  width: 6px;
}
.cards-container::-webkit-scrollbar-track {
  background: transparent;
}
.cards-container::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.15);
  border-radius: 3px;
}

/* ========== 卡片 ========== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: box-shadow var(--transition-fast), transform var(--transition-fast), opacity var(--transition-base);
  border: 1px solid var(--border);
  position: relative;
  flex-shrink: 0;
}

.card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.card.dragging {
  opacity: 0.4;
}

.card.flip-animating {
  transition: transform var(--transition-slow), opacity var(--transition-slow);
  pointer-events: none;
}

.card-labels {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}

.card-label {
  width: 36px;
  height: 8px;
  border-radius: 4px;
  flex-shrink: 0;
}

.card-title {
  font-size: 14px;
  line-height: 1.4;
  color: var(--text);
  font-weight: 500;
  word-break: break-word;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-muted);
}

.card-meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.card-meta-item svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

/* 拖拽占位符 */
.card-placeholder {
  border: 2px dashed var(--primary);
  border-radius: var(--radius-md);
  background: rgba(91, 108, 255, 0.08);
  flex-shrink: 0;
  transition: height var(--transition-base);
}

/* 拖拽中的浮动卡片 */
.card-float {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  transform: rotate(3deg);
  box-shadow: var(--shadow-xl) !important;
  opacity: 0.92;
  width: var(--list-width);
}

/* ========== 添加卡片 / 添加列表 ========== */
.add-card-btn, .add-list-btn {
  margin: 0 10px 10px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all var(--transition-fast);
  font-family: inherit;
  text-align: left;
}

.add-card-btn:hover {
  background: rgba(0,0,0,0.06);
  color: var(--text);
}

.add-card-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  flex-shrink: 0;
}

.add-card-form {
  margin: 0 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.add-card-textarea {
  width: 100%;
  min-height: 60px;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  outline: none;
  background: var(--card-bg);
  color: var(--text);
  transition: border-color var(--transition-fast);
}

.add-card-textarea:focus {
  border-color: var(--primary);
}

.add-card-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-primary {
  padding: 8px 16px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
  font-family: inherit;
}

.btn-primary:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.btn-danger {
  padding: 8px 16px;
  background: var(--danger);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
  font-family: inherit;
}

.btn-danger:hover {
  background: #dc2626;
}

.btn-ghost {
  padding: 8px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-ghost:hover {
  background: rgba(0,0,0,0.06);
  color: var(--text);
}

.btn-ghost svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

/* 添加列表 */
.add-list-wrap {
  flex: 0 0 var(--list-width);
  width: var(--list-width);
  flex-shrink: 0;
}

.add-list-btn {
  width: 44px;
  height: 44px;
  margin: 0 10px 10px;
  padding: 0;
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: var(--radius-lg);
  color: white;
  font-weight: 500;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  justify-content: center;
}

.add-list-btn svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

.add-list-btn:hover {
  background: var(--surface-hover);
  transform: translateY(-1px);
}

.add-list-form {
  background: var(--list-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: var(--radius-lg);
  padding: 10px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.add-list-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  background: var(--card-bg);
  color: var(--text);
}

.add-list-input:focus {
  border-color: var(--primary);
}

/* ========== 弹窗遮罩 ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 1000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 20px;
  overflow-y: auto;
  opacity: 0;
  transition: opacity var(--transition-base);
}

.modal-overlay.visible {
  opacity: 1;
}

.modal {
  width: 100%;
  max-width: 680px;
  background: var(--surface-strong);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xl);
  border: 1px solid var(--border);
  padding: 32px;
  position: relative;
  transform: scale(0.9);
  opacity: 0;
  transition: transform var(--transition-slow) cubic-bezier(0.34, 1.56, 0.64, 1),
              opacity var(--transition-base);
  transform-origin: top left;
}

.modal.visible {
  transform: scale(1);
  opacity: 1;
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.06);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
}

.modal-close:hover {
  background: rgba(0,0,0,0.12);
  color: var(--text);
  transform: rotate(90deg);
}

.modal-close svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

.modal-header {
  margin-bottom: 24px;
  padding-right: 40px;
}

.modal-icon {
  display: inline-flex;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
  color: white;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  box-shadow: var(--shadow-md);
}

.modal-icon svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

.modal-title-input {
  width: 100%;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  border: none;
  background: transparent;
  outline: none;
  font-family: inherit;
  padding: 4px 0;
  border-bottom: 2px solid transparent;
  transition: border-color var(--transition-fast);
  letter-spacing: -0.01em;
}

.modal-title-input:focus {
  border-bottom-color: var(--primary);
}

.modal-list-ref {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}

.modal-section {
  margin-bottom: 24px;
}

.modal-section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
}

.modal-section-title svg {
  width: 18px;
  height: 18px;
  stroke: var(--text-muted);
  fill: none;
  stroke-width: 2;
}

/* 描述 */
.desc-textarea {
  width: 100%;
  min-height: 100px;
  padding: 12px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  font-size: 14px;
  line-height: 1.5;
  font-family: inherit;

.subtask-item:hover {

  height: 18px;

.subtask-checkbox:hover {

.subtask-checkbox.checked svg {

.subtask-text {

  color: var(--text);

  min-width: 0;

.subtask-item.completed .subtask-text {

.confirm-overlay {

// ---------- 工具函数 ----------
function uid(prefix = 'id') {
  return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && data.lists && Array.isArray(data.lists)) {
        if (!data.boardTitle) data.boardTitle = '产品研发看板';
        return data;
      }
    }
  } catch (e) {}
  return getDefaultData();
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function findCard(cardId) {
  for (const list of state.lists) {
    const card = list.cards.find(c => c.id === cardId);
    if (card) return { card, list };
  }
  return null;
}

function findList(listId) {
  return state.lists.find(l => l.id === listId);
}

// ---------- 渲染 ----------
const boardContent = document.getElementById('boardContent');
const boardContainer = document.getElementById('boardContainer');

function render() {
  // 保存当前滚动位置
  const scrollLeft = boardContainer.scrollLeft;

  boardContent.innerHTML = '';

  state.lists.forEach(list => {
    boardContent.appendChild(createListEl(list));
  });

  // 添加列表按钮
  const addListWrap = document.createElement('div');
  addListWrap.className = 'add-list-wrap';
  addListWrap.innerHTML = `
    <button class="add-list-btn" id="addListBtn" title="添加列表">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  `;
  boardContent.appendChild(addListWrap);

  // 绑定添加列表
  document.getElementById('addListBtn').addEventListener('click', showAddListForm);

  // 恢复滚动位置
  boardContainer.scrollLeft = scrollLeft;

  saveData();
}

function createListEl(list) {
  const listEl = document.createElement('div');
  listEl.className = 'list';
  listEl.dataset.listId = list.id;
  listEl.innerHTML = `
    <div class="list-header" data-list-drag-handle="${list.id}">
      <div class="list-title" data-list-title="${list.id}">${escapeHtml(list.title)}</div>
      <span class="list-count">${list.cards.length}</span>
      <button class="list-menu-btn" data-list-menu="${list.id}" title="删除列表">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </button>
    </div>
    <div class="cards-container" data-cards-container="${list.id}">
      ${list.cards.map(card => createCardHTML(card)).join('')}
    </div>
    <button class="add-card-btn" data-add-card="${list.id}">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加卡片
    </button>
  `;

  // 列表标题点击编辑
  const titleEl = listEl.querySelector('[data-list-title]');
  titleEl.addEventListener('click', (e) => {
    if (dragState.type) return;
    e.stopPropagation();
    startEditListTitle(list.id, titleEl);
  });

  // 列表菜单（删除）
  const menuBtn = listEl.querySelector('[data-list-menu]');
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    showConfirm(
      '删除列表',
      `确定要删除列表「${list.title}」及其所有 ${list.cards.length} 张卡片吗？此操作不可撤销。`,
      () => deleteList(list.id)
    );
  });

  // 添加卡片按钮
  const addCardBtn = listEl.querySelector('[data-add-card]');
  addCardBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    showAddCardForm(list.id, addCardBtn);
  });

  // 卡片容器拖拽相关
  const cardsContainer = listEl.querySelector('[data-cards-container]');
  cardsContainer.addEventListener('mousedown', onCardMouseDown);

  // 列表头部拖拽
  const header = listEl.querySelector('[data-list-drag-handle]');
  header.addEventListener('mousedown', onListDragStart);

  return listEl;
}

function createCardHTML(card) {
  const labelsHTML = card.labels && card.labels.length > 0
    ? `<div class="card-labels">${card.labels.map(lid => {
        const lc = LABEL_COLORS.find(l => l.id === lid);
        return lc ? `<span class="card-label" style="background:${lc.color}"></span>` : '';
      }).join('')}</div>`
    : '';

  const subtaskCount = card.subtasks ? card.subtasks.length : 0;
  const completedCount = card.subtasks ? card.subtasks.filter(s => s.completed).length : 0;
  const metaHTML = subtaskCount > 0
    ? `<div class="card-meta">
        <div class="card-meta-item">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          ${completedCount}/${subtaskCount}
        </div>
      </div>`
    : '';

  return `
    <div class="card" data-card-id="${card.id}">
      ${labelsHTML}
      <div class="card-title">${escapeHtml(card.title)}</div>
      ${metaHTML}
    </div>
  `;
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- 列表操作 ----------
function showAddListForm() {
  const wrap = document.querySelector('.add-list-wrap');
  if (!wrap) return;
  wrap.innerHTML = `
    <div class="add-list-form">
      <input type="text" class="add-list-input" id="newListInput" placeholder="输入列表标题...">
      <div class="add-card-actions">
        <button class="btn-primary" id="newListSubmit">添加列表</button>
        <button class="btn-ghost" id="newListCancel" title="取消">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  `;
  const input = document.getElementById('newListInput');
  input.focus();

  document.getElementById('newListSubmit').addEventListener('click', addList);
  document.getElementById('newListCancel').addEventListener('click', render);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addList();
    if (e.key === 'Escape') render();
  });
}

function addList() {
  const input = document.getElementById('newListInput');
  const title = input.value.trim();
  if (!title) return;
  state.lists.push({
    id: uid('list'),
    title,
    cards: []
  });
  render();
  // 滚动到最右
  requestAnimationFrame(() => {
    boardContainer.scrollLeft = boardContainer.scrollWidth;
  });
}

function startEditListTitle(listId, titleEl) {
  const list = findList(listId);
  if (!list) return;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'list-title-input';
  input.value = list.title;
  titleEl.replaceWith(input);
  input.focus();
  input.select();

  function finish(save) {
    if (save) {
      const newTitle = input.value.trim();
      if (newTitle && newTitle !== list.title) {
        list.title = newTitle;
        saveData();
      }
    }
    render();
  }

  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { input.blur(); }
    if (e.key === 'Escape') finish(false);
  });
}

function deleteList(listId) {
  state.lists = state.lists.filter(l => l.id !== listId);
  render();
}

// ---------- 卡片操作 ----------
function showAddCardForm(listId, btnEl) {
  const list = findList(listId);
  if (!list) return;

  const form = document.createElement('div');
  form.className = 'add-card-form';
  form.innerHTML = `
    <textarea class="add-card-textarea" placeholder="输入卡片标题..."></textarea>
    <div class="add-card-actions">
      <button class="btn-primary add-card-submit">添加卡片</button>
      <button class="btn-ghost add-card-cancel" title="取消">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  `;

  btnEl.replaceWith(form);
  const textarea = form.querySelector('.add-card-textarea');
  textarea.focus();

  function submit() {
    const title = textarea.value.trim();
    if (title) {
      list.cards.push({
        id: uid('card'),
        title,
        description: '',
        labels: [],
        subtasks: []
      });
      saveData();
    }
    render();
  }

  form.querySelector('.add-card-submit').addEventListener('click', submit);
  form.querySelector('.add-card-cancel').addEventListener('click', () => render());
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
    if (e.key === 'Escape') render();
  });
}

// ---------- 卡片拖拽（核心） ----------
function onCardMouseDown(e) {
  // 只响应左键
  if (e.button !== 0) return;

  const cardEl = e.target.closest('.card');
  if (!cardEl) return;

  // 如果点到了卡片内部的可交互元素（未来可能有），跳过
  if (e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) return;

  // 记录起始位置，延迟到移动一定距离后才真正进入拖拽状态（区分点击和拖拽）
  const cardId = cardEl.dataset.cardId;
  const found = findCard(cardId);
  if (!found) return;

  dragState.type = 'card-pending';
  dragState.cardId = cardId;
  dragState.fromListId = found.list.id;
  dragState.startX = e.clientX;
  dragState.startY = e.clientY;
  dragState.offsetX = e.clientX - cardEl.getBoundingClientRect().left;
  dragState.offsetY = e.clientY - cardEl.getBoundingClientRect().top;
  dragState.originRect = cardEl.getBoundingClientRect();
  dragState.moved = false;

  document.addEventListener('mousemove', onCardDragMove);
  document.addEventListener('mouseup', onCardDragEnd);
}

function startCardDrag() {
  const cardEl = document.querySelector(`.card[data-card-id="${dragState.cardId}"]`);
  if (!cardEl) return;

  const rect = cardEl.getBoundingClientRect();

  // 创建浮动卡片
  const floatEl = cardEl.cloneNode(true);
  floatEl.classList.add('card-float');
  floatEl.style.width = rect.width + 'px';
  floatEl.style.left = rect.left + 'px';
  floatEl.style.top = rect.top + 'px';
  document.body.appendChild(floatEl);
  dragState.floatEl = floatEl;

  // 原卡片添加拖拽样式（半透明）
  cardEl.classList.add('dragging');

  // 创建占位符
  const placeholder = document.createElement('div');
  placeholder.className = 'card-placeholder';
  placeholder.style.height = rect.height + 'px';
  dragState.placeholderEl = placeholder;
  dragState.placeholderHeight = rect.height;

  // 用占位符替换原卡片位置
  cardEl.parentNode.insertBefore(placeholder, cardEl);
  cardEl.style.display = 'none';

  // 记录初始位置
  const listEl = cardEl.closest('.list');
  dragState.lastOverListId = listEl.dataset.listId;
  const cardsContainer = listEl.querySelector('[data-cards-container]');
  const cardEls = Array.from(cardsContainer.querySelectorAll('.card:not(.dragging)'));
  dragState.lastOverIndex = cardEls.length; // 占位符替换了原卡片，索引就是当前位置

  // 重新计算 lastOverIndex：找到占位符在容器中的实际位置（排除 dragging 的卡片）
  const allChildren = Array.from(cardsContainer.children);
  let idx = 0;
  for (let i = 0; i < allChildren.length; i++) {
    const child = allChildren[i];
    if (child === placeholder) { dragState.lastOverIndex = idx; break; }
    if (child.classList && child.classList.contains('card') && !child.classList.contains('dragging')) {
      idx++;
    }
  }

  dragState.type = 'card';
  document.body.classList.add('dragging-active');
}

function onCardDragMove(e) {
  // pending 状态：检查移动距离是否超过阈值
  if (dragState.type === 'card-pending') {
    const dx = Math.abs(e.clientX - dragState.startX);
    const dy = Math.abs(e.clientY - dragState.startY);
    if (dx > 5 || dy > 5) {
      dragState.moved = true;
      startCardDrag();
    } else {
      return;
    }
  }

  if (dragState.type !== 'card') return;
  e.preventDefault();

  // 更新浮动卡片位置
  dragState.floatEl.style.left = (e.clientX - dragState.offsetX) + 'px';
  dragState.floatEl.style.top = (e.clientY - dragState.offsetY) + 'px';

  // 边缘自动滚动
  handleEdgeAutoScroll(e);

  // 找到鼠标下的列表或卡片
  // 先隐藏浮动元素以便 elementFromPoint 能检测到下方元素
  dragState.floatEl.style.display = 'none';
  const below = document.elementFromPoint(e.clientX, e.clientY);
  dragState.floatEl.style.display = '';

  if (!below) return;

  const listEl = below.closest('.list');
  if (!listEl) return;

  const listId = listEl.dataset.listId;
  const cardsContainer = listEl.querySelector('[data-cards-container]');
  const cardEls = Array.from(cardsContainer.querySelectorAll('.card:not(.dragging)'));

  // 计算插入位置（基于非拖拽卡片的索引）
  let insertIndex = cardEls.length; // 默认最后

  for (let i = 0; i < cardEls.length; i++) {
    const card = cardEls[i];
    const r = card.getBoundingClientRect();
    const midY = r.top + r.height / 2;
    if (e.clientY < midY) {
      insertIndex = i;
      break;
    }
  }

  // 检查是否需要移动（列表或位置变化）
  if (listId !== dragState.lastOverListId || insertIndex !== dragState.lastOverIndex) {
    movePlaceholderWithFLIP(cardsContainer, listId, insertIndex);
    dragState.lastOverListId = listId;
    dragState.lastOverIndex = insertIndex;
  }
}

function movePlaceholderWithFLIP(targetContainer, targetListId, insertIndex) {
  const sourceContainer = dragState.placeholderEl.parentNode;
  const isCrossList = sourceContainer !== targetContainer;

  // First: 记录源列表和目标列表所有卡片的位置
  const animatableCards = [];
  const firstPositions = new Map();

  if (isCrossList && sourceContainer) {
    const sourceCards = Array.from(sourceContainer.querySelectorAll('.card:not(.dragging)'));
    sourceCards.forEach(c => {
      animatableCards.push(c);
      firstPositions.set(c, c.getBoundingClientRect());
    });
  }

  const targetCards = Array.from(targetContainer.querySelectorAll('.card:not(.dragging)'));
  targetCards.forEach(c => {
    if (!firstPositions.has(c)) {
      animatableCards.push(c);
      firstPositions.set(c, c.getBoundingClientRect());
    }
  });

  // Last: 移动占位符到新位置
  const targetCard = targetCards[insertIndex];
  if (targetCard) {
    targetContainer.insertBefore(dragState.placeholderEl, targetCard);
  } else {
    targetContainer.appendChild(dragState.placeholderEl);
  }

  // Invert + Play: 对所有受影响的卡片做 FLIP 动画
  animatableCards.forEach(card => {
    const first = firstPositions.get(card);
    if (!first) return;
    const last = card.getBoundingClientRect();
    const dx = first.left - last.left;
    const dy = first.top - last.top;

    if (dx === 0 && dy === 0) return;

    // 应用 invert transform
    card.style.transition = 'none';
    card.style.transform = `translate(${dx}px, ${dy}px)`;

    // 强制 reflow
    card.offsetHeight;

    // Play: 动画到最终位置
    card.style.transition = 'transform 240ms cubic-bezier(0.4, 0, 0.2, 1)';
    card.style.transform = '';

    // 清理
    const cleanup = () => {
      card.style.transition = '';
      card.style.transform = '';
      card.removeEventListener('transitionend', cleanup);
    };
    card.addEventListener('transitionend', cleanup);
  });
}

function onCardDragEnd(e) {
  // pending 状态：没有真正拖拽，当作点击处理（不阻止默认行为）
  if (dragState.type === 'card-pending') {
    document.removeEventListener('mousemove', onCardDragMove);
    document.removeEventListener('mouseup', onCardDragEnd);
    dragState.type = null;
    dragState.cardId = null;
    dragState.fromListId = null;
    dragState.moved = false;
    return;
  }

  if (dragState.type !== 'card') return;

  document.removeEventListener('mousemove', onCardDragMove);
  document.removeEventListener('mouseup', onCardDragEnd);
  document.body.classList.remove('dragging-active');

  // 停止自动滚动
  stopAutoScroll();

  const cardId = dragState.cardId;
  const targetListId = dragState.lastOverListId;
  const targetIndex = dragState.lastOverIndex;
  const fromListId = dragState.fromListId;

  // 找到原卡片 DOM
  const originalCardEl = document.querySelector(`.card[data-card-id="${cardId}"]`);

  // 记录占位符目标位置（用于浮动卡片落入动画）
  const placeholderRect = dragState.placeholderEl.getBoundingClientRect();
  const floatEl = dragState.floatEl;

  // 数据更新
  updateCardPosition(cardId, fromListId, targetListId, targetIndex);

  // 手动更新 DOM：将原卡片移动到占位符位置，然后移除占位符
  const placeholderParent = dragState.placeholderEl.parentNode;
  if (placeholderParent && originalCardEl) {
    originalCardEl.style.display = '';
    originalCardEl.classList.remove('dragging');
    placeholderParent.insertBefore(originalCardEl, dragState.placeholderEl);
    dragState.placeholderEl.parentNode.removeChild(dragState.placeholderEl);
  }

  // 浮动卡片动画落入目标位置（淡出）
  if (floatEl) {
    floatEl.style.transition = 'left 240ms cubic-bezier(0.4, 0, 0.2, 1), top 240ms cubic-bezier(0.4, 0, 0.2, 1), opacity 240ms ease, transform 240ms ease';
    floatEl.style.left = placeholderRect.left + 'px';
    floatEl.style.top = placeholderRect.top + 'px';
    floatEl.style.transform = 'rotate(0deg)';
    floatEl.style.opacity = '0';

    setTimeout(() => {
      if (floatEl && floatEl.parentNode) floatEl.parentNode.removeChild(floatEl);
    }, 260);
  }

  // 更新列表计数
  updateListCount(fromListId);
  if (fromListId !== targetListId) {
    updateListCount(targetListId);
  }

  // 保存数据
  saveData();

  // 标记刚刚拖拽过，防止触发 click 事件
  justDragged = true;
  setTimeout(() => { justDragged = false; }, 50);

  // 清理拖拽状态
  Object.assign(dragState, {
    type: null,
    cardId: null,
    listId: null,
    fromListId: null,
    floatEl: null,
    offsetX: 0,
    offsetY: 0,
    startX: 0,
    startY: 0,
    moved: false,
    placeholderEl: null,
    placeholderHeight: 0,
    lastOverListId: null,
    lastOverIndex: -1,
    originRect: null,
  });
}

function updateListCount(listId) {
  const list = findList(listId);
  if (!list) return;
  const listEl = document.querySelector(`.list[data-list-id="${listId}"]`);
  if (!listEl) return;
  const countEl = listEl.querySelector('.list-count');
  if (countEl) countEl.textContent = list.cards.length;
}

function updateCardPosition(cardId, fromListId, toListId, toIndex) {
  const fromList = findList(fromListId);
  const toList = findList(toListId);
  if (!fromList || !toList) return;

  // 找到并移除卡片
  const cardIndex = fromList.cards.findIndex(c => c.id === cardId);
  if (cardIndex === -1) return;
  const [card] = fromList.cards.splice(cardIndex, 1);

  // toIndex 已经是基于「排除拖拽卡片」的目标索引，直接使用
  const targetIdx = Math.max(0, Math.min(toIndex, toList.cards.length));
  toList.cards.splice(targetIdx, 0, card);

  saveData();
}

// ---------- 列表拖拽 ----------
function onListDragStart(e) {
  if (e.button !== 0) return;
  // 如果点到了标题编辑或菜单按钮，不触发拖拽
  if (e.target.closest('.list-menu-btn') || e.target.closest('.list-title-input')) return;

  e.preventDefault();

  const handle = e.currentTarget;
  const listEl = handle.closest('.list');
  if (!listEl) return;

  const listId = listEl.dataset.listId;
  const rect = listEl.getBoundingClientRect();

  // pending 状态，移动后才真正进入拖拽
  dragState.type = 'list-pending';
  dragState.listId = listId;
  dragState.startX = e.clientX;
  dragState.startY = e.clientY;
  dragState.offsetX = e.clientX - rect.left;
  dragState.offsetY = e.clientY - rect.top;
  dragState.moved = false;

  document.addEventListener('mousemove', onListDragMove);
  document.addEventListener('mouseup', onListDragEnd);
}

function startListDrag() {
  const listEl = document.querySelector(`.list[data-list-id="${dragState.listId}"]`);
  if (!listEl) return;

  const rect = listEl.getBoundingClientRect();

  // 创建浮动列表
  const floatEl = listEl.cloneNode(true);
  floatEl.style.position = 'fixed';
  floatEl.style.zIndex = '9999';
  floatEl.style.pointerEvents = 'none';
  floatEl.style.width = rect.width + 'px';
  floatEl.style.left = rect.left + 'px';
  floatEl.style.top = rect.top + 'px';
  floatEl.style.transform = 'rotate(2deg)';
  floatEl.style.boxShadow = 'var(--shadow-xl)';
  floatEl.style.opacity = '0.92';
  floatEl.classList.add('list-float');
  document.body.appendChild(floatEl);
  dragState.floatEl = floatEl;

  // 原列表半透明
  listEl.classList.add('dragging-list');

  // 记录初始索引
  const listEls = Array.from(boardContent.querySelectorAll('.list'));
  dragState.lastOverIndex = listEls.findIndex(el => el.dataset.listId === dragState.listId);

  dragState.type = 'list';
  document.body.classList.add('dragging-active');
}

function onListDragMove(e) {
  // pending 状态
  if (dragState.type === 'list-pending') {
    const dx = Math.abs(e.clientX - dragState.startX);
    const dy = Math.abs(e.clientY - dragState.startY);
    if (dx > 5 || dy > 5) {
      dragState.moved = true;
      startListDrag();
    } else {
      return;
    }
  }

  if (dragState.type !== 'list') return;
  e.preventDefault();

  dragState.floatEl.style.left = (e.clientX - dragState.offsetX) + 'px';
  dragState.floatEl.style.top = (e.clientY - dragState.offsetY) + 'px';

  // 边缘自动滚动
  handleEdgeAutoScroll(e);

  // 检测下方列表
  dragState.floatEl.style.display = 'none';
  const below = document.elementFromPoint(e.clientX, e.clientY);
  dragState.floatEl.style.display = '';

  if (!below) return;

  const listEl = below.closest('.list');
  const addListWrap = below.closest('.add-list-wrap');

  let targetIndex = -1;
  const listEls = Array.from(boardContent.querySelectorAll('.list'));

  if (listEl) {
    const targetId = listEl.dataset.listId;
    const rect = listEl.getBoundingClientRect();
    const midX = rect.left + rect.width / 2;

    // 找到目标索引
    const idx = listEls.findIndex(el => el.dataset.listId === targetId);
    if (e.clientX < midX) {
      targetIndex = idx;
    } else {
      targetIndex = idx + 1;
    }
  } else if (addListWrap) {
    targetIndex = listEls.length;
  } else {
    return;
  }

  // 当前拖拽列表的当前索引
  const currentIdx = listEls.findIndex(el => el.dataset.listId === dragState.listId);
  if (currentIdx === -1) return;

  // targetIndex 是插入位置（0 到 listEls.length），当前元素移除后其他元素位置会变化
  // 计算实际目标索引
  let finalTarget = targetIndex;
  if (currentIdx < targetIndex) finalTarget--;
  finalTarget = Math.max(0, Math.min(finalTarget, listEls.length - 1));

  if (finalTarget !== currentIdx) {
    moveListWithFLIP(currentIdx, finalTarget);
  }
}

function moveListWithFLIP(fromIdx, toIdx) {
  const listEls = Array.from(boardContent.querySelectorAll('.list'));
  const dragListId = dragState.listId;
  const dragEl = listEls[fromIdx];

  // First: 记录所有列表位置
  const firstPositions = new Map();
  listEls.forEach(el => {
    firstPositions.set(el, el.getBoundingClientRect());
  });

  // Last: 移动 DOM 到目标索引位置
  // 重新获取当前列表（因为 listEls 是移动前的快照）
  const currentListEls = Array.from(boardContent.querySelectorAll('.list'));
  const currentDragEl = currentListEls.find(el => el.dataset.listId === dragListId);
  if (!currentDragEl) return;

  // toIdx 是「移除被拖拽列后的精简数组」中的插入下标（左右双向通用）
  // 排除被拖拽的列，得到其余列的顺序数组
  const others = currentListEls.filter(el => el !== currentDragEl);
  // 目标位置：下标在 others 范围内则插到该列前面；超出范围（拖到最右）则插到「添加列表」按钮之前
  const refNode = others[toIdx] || boardContent.querySelector('.add-list-wrap');
  if (refNode && currentDragEl !== refNode) {
    boardContent.insertBefore(currentDragEl, refNode);
  }

  // Invert + Play
  listEls.forEach(el => {
    const first = firstPositions.get(el);
    if (!first) return;
    const last = el.getBoundingClientRect();
    const dx = first.left - last.left;

    if (dx === 0) return;

    el.style.transition = 'none';
    el.style.transform = `translateX(${dx}px)`;
    el.offsetHeight; // reflow
    el.style.transition = 'transform 280ms cubic-bezier(0.4, 0, 0.2, 1)';
    el.style.transform = '';

    const cleanup = () => {
      el.style.transition = '';
      el.style.transform = '';
      el.removeEventListener('transitionend', cleanup);
    };
    el.addEventListener('transitionend', cleanup);
  });

  // 更新数据中的顺序（保持与 DOM 一致）
  // toIdx 已经是「移除拖拽列之后」的插入下标，直接使用，无需再换算
  const fromDataIdx = state.lists.findIndex(l => l.id === dragListId);
  const [movedList] = state.lists.splice(fromDataIdx, 1);
  state.lists.splice(toIdx, 0, movedList);
  saveData();
}

function onListDragEnd(e) {
  // pending 状态：没有真正拖拽
  if (dragState.type === 'list-pending') {
    document.removeEventListener('mousemove', onListDragMove);
    document.removeEventListener('mouseup', onListDragEnd);
    dragState.type = null;
    dragState.listId = null;
    dragState.moved = false;
    return;
  }

  if (dragState.type !== 'list') return;

  document.removeEventListener('mousemove', onListDragMove);
  document.removeEventListener('mouseup', onListDragEnd);
  document.body.classList.remove('dragging-active');
  stopAutoScroll();

  const listEl = document.querySelector(`.list[data-list-id="${dragState.listId}"]`);
  const targetRect = listEl ? listEl.getBoundingClientRect() : null;

  const floatEl = dragState.floatEl;

  if (targetRect && floatEl) {
    floatEl.style.transition = 'left 260ms cubic-bezier(0.4, 0, 0.2, 1), top 260ms cubic-bezier(0.4, 0, 0.2, 1), opacity 260ms ease, transform 260ms ease';
    floatEl.style.left = targetRect.left + 'px';
    floatEl.style.top = targetRect.top + 'px';
    floatEl.style.transform = 'rotate(0deg)';
    floatEl.style.opacity = '0';
  }

  if (listEl) listEl.classList.remove('dragging-list');

  setTimeout(() => {
    if (floatEl && floatEl.parentNode) floatEl.parentNode.removeChild(floatEl);
  }, 280);

  // 保存数据（DOM 已经在 moveListWithFLIP 中移动了）
  saveData();

  // 标记刚刚拖拽过，防止触发 click 事件
  justDragged = true;
  setTimeout(() => { justDragged = false; }, 50);

  Object.assign(dragState, {
    type: null,
    cardId: null,
    listId: null,
    fromListId: null,
    floatEl: null,
    offsetX: 0,
    offsetY: 0,
    startX: 0,
    startY: 0,
    moved: false,
    placeholderEl: null,
    placeholderHeight: 0,
    lastOverListId: null,
    lastOverIndex: -1,
    originRect: null,
  });
}

// ---------- 边缘自动滚动 ----------
function handleEdgeAutoScroll(e) {
  const container = boardContainer;
  const containerRect = container.getBoundingClientRect();
  const edgeThreshold = 80; // 触发自动滚动的边缘宽度
  const maxSpeed = 20;

  let speed = 0;

  // 左边缘
  if (e.clientX < containerRect.left + edgeThreshold) {
    const dist = e.clientX - containerRect.left;
    speed = -Math.max(1, maxSpeed * (1 - dist / edgeThreshold));
  }
  // 右边缘
  else if (e.clientX > containerRect.right - edgeThreshold) {
    const dist = containerRect.right - e.clientX;
    speed = Math.max(1, maxSpeed * (1 - dist / edgeThreshold));
  }

  if (speed !== 0) {
    dragState.autoScrollSpeed = speed;
    if (!dragState.autoScrollRAF) {
      autoScrollLoop();
    }
  } else {
    stopAutoScroll();
  }
}

function autoScrollLoop() {
  if (!dragState.type) return;
  boardContainer.scrollLeft += dragState.autoScrollSpeed;
  dragState.autoScrollRAF = requestAnimationFrame(autoScrollLoop);
}

function stopAutoScroll() {
  if (dragState.autoScrollRAF) {
    cancelAnimationFrame(dragState.autoScrollRAF);
    dragState.autoScrollRAF = null;
  }
  dragState.autoScrollSpeed = 0;
}

// ---------- 卡片详情弹窗（FLIP 动画） ----------
const modalOverlay = document.getElementById('modalOverlay');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalListRef = document.getElementById('modalListRef');
const labelsGrid = document.getElementById('labelsGrid');
const descContainer = document.getElementById('descContainer');
const subtasksList = document.getElementById('subtasksList');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const subtaskInput = document.getElementById('subtaskInput');

// 点击卡片打开弹窗
let justDragged = false;
boardContent.addEventListener('click', (e) => {
  if (justDragged) {
    justDragged = false;
    return;
  }
  const cardEl = e.target.closest('.card');
  if (!cardEl) return;
  if (e.target.closest('button')) return;

  const cardId = cardEl.dataset.cardId;
  openCardModal(cardId, cardEl);
});

function openCardModal(cardId, cardEl) {
  const found = findCard(cardId);
  if (!found) return;

  currentCardId = cardId;
  currentListId = found.list.id;

  // 填充内容
  modalTitle.value = found.card.title;
  modalListRef.textContent = `在列表「${found.list.title}」中`;

  // 渲染标签
  renderLabels(found.card);

  // 渲染描述
  renderDescription(found.card);

  // 渲染子任务
  renderSubtasks(found.card);

  // FLIP 动画
  const cardRect = cardEl.getBoundingClientRect();

  // 先显示 overlay 和 modal（透明状态），获取 modal 目标尺寸
  modalOverlay.style.display = 'flex';
  modalOverlay.style.opacity = '0';
  modal.style.transition = 'none';
  modal.style.opacity = '0';
  modal.style.transform = 'none';

  // 强制 reflow，获取 modal 的目标位置
  modalOverlay.offsetHeight;
  const modalRect = modal.getBoundingClientRect();

  // 计算起始缩放和位移（从卡片位置开始）
  const startLeft = cardRect.left - modalRect.left;
  const startTop = cardRect.top - modalRect.top;
  const scaleX = cardRect.width / modalRect.width;
  const scaleY = cardRect.height / modalRect.height;

  // 设置初始状态
  modal.style.transformOrigin = 'top left';
  modal.style.transform = `translate(${startLeft}px, ${startTop}px) scale(${scaleX}, ${scaleY})`;
  modal.style.opacity = '0.7';

  // 强制 reflow
  modal.offsetHeight;

  // 遮罩淡入
  modalOverlay.style.opacity = '1';

  // 动画到目标位置
  requestAnimationFrame(() => {
    modal.style.transition = 'transform 350ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 250ms ease';
    modal.style.transform = 'translate(0, 0) scale(1)';
    modal.style.opacity = '1';
  });
}

function closeCardModal() {
  if (!currentCardId) return;

  const cardEl = document.querySelector(`.card[data-card-id="${currentCardId}"]`);

  if (cardEl) {
    const cardRect = cardEl.getBoundingClientRect();
    const modalRect = modal.getBoundingClientRect();
    const targetLeft = cardRect.left - modalRect.left;
    const targetTop = cardRect.top - modalRect.top;
    const scaleX = cardRect.width / modalRect.width;
    const scaleY = cardRect.height / modalRect.height;

    modal.style.transition = 'transform 300ms cubic-bezier(0.4, 0, 0.2, 1), opacity 250ms ease';
    modal.style.transform = `translate(${targetLeft}px, ${targetTop}px) scale(${scaleX}, ${scaleY})`;
    modal.style.opacity = '0';
  } else {
    modal.style.opacity = '0';
  }

  modalOverlay.style.opacity = '0';

  setTimeout(() => {
    modalOverlay.style.display = 'none';
    modal.style.transform = '';
    modal.style.opacity = '';
    modal.style.transition = '';
    currentCardId = null;
    currentListId = null;
  }, 300);
}

document.getElementById('modalClose').addEventListener('click', closeCardModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeCardModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && currentCardId) closeCardModal();
});

// 标题编辑
modalTitle.addEventListener('input', () => {
  const found = findCard(currentCardId);
  if (!found) return;
  found.card.title = modalTitle.value;
  saveData();
  // 同步更新卡片显示
  const cardEl = document.querySelector(`.card[data-card-id="${currentCardId}"] .card-title`);
  if (cardEl) cardEl.textContent = modalTitle.value;
});

// ---------- 标签渲染与交互 ----------
function renderLabels(card) {
  labelsGrid.innerHTML = LABEL_COLORS.map(lc => {
    const selected = card.labels && card.labels.includes(lc.id);
    return `<div class="label-option ${selected ? 'selected' : ''}" 
                data-label-id="${lc.id}" 
                style="background:${lc.color}"
                title="${lc.name}"></div>`;
  }).join('');

  labelsGrid.querySelectorAll('.label-option').forEach(el => {
    el.addEventListener('click', () => {
      const labelId = el.dataset.labelId;
      const found = findCard(currentCardId);
      if (!found) return;

      if (!found.card.labels) found.card.labels = [];
      const idx = found.card.labels.indexOf(labelId);
      if (idx === -1) {
        found.card.labels.push(labelId);
        el.classList.add('selected');
      } else {
        found.card.labels.splice(idx, 1);
        el.classList.remove('selected');
      }
      saveData();
      updateCardLabelsInBoard(currentCardId, found.card.labels);
    });
  });
}

function updateCardLabelsInBoard(cardId, labels) {
  const cardEl = document.querySelector(`.card[data-card-id="${cardId}"]`);
  if (!cardEl) return;

  let labelsContainer = cardEl.querySelector('.card-labels');
  const labelsHTML = labels && labels.length > 0
    ? `<div class="card-labels">${labels.map(lid => {
        const lc = LABEL_COLORS.find(l => l.id === lid);
        return lc ? `<span class="card-label" style="background:${lc.color}"></span>` : '';
      }).join('')}</div>`
    : '';

  if (labelsContainer) {
    if (labels && labels.length > 0) {
      labelsContainer.outerHTML = labelsHTML;
    } else {
      labelsContainer.remove();
    }
  } else if (labels && labels.length > 0) {
    const titleEl = cardEl.querySelector('.card-title');
    titleEl.insertAdjacentHTML('beforebegin', labelsHTML);
  }
}

// ---------- 描述 ----------
function renderDescription(card) {
  if (card.description && card.description.trim()) {
    descContainer.innerHTML = `<textarea class="desc-textarea" id="descTextarea" placeholder="添加更详细的描述...">${escapeHtml(card.description)}</textarea>`;
    const ta = document.getElementById('descTextarea');
    ta.addEventListener('input', () => {
      const found = findCard(currentCardId);
      if (found) {
        found.card.description = ta.value;
        saveData();
      }
    });
  } else {
    descContainer.innerHTML = `<div class="desc-placeholder" id="descPlaceholder">点击添加更详细的描述...</div>`;
    document.getElementById('descPlaceholder').addEventListener('click', () => {
      const found = findCard(currentCardId);
      if (!found) return;
      found.card.description = '';
      renderDescription(found.card);
      const ta = document.getElementById('descTextarea');
      if (ta) ta.focus();
    });
  }
}

// ---------- 子任务 ----------
function renderSubtasks(card) {
  const subtasks = card.subtasks || [];
  const total = subtasks.length;
  const completed = subtasks.filter(s => s.completed).length;
  const percent = total > 0 ? (completed / total * 100) : 0;

  progressFill.style.width = percent + '%';
  progressText.textContent = `${completed}/${total}`;

  subtasksList.innerHTML = subtasks.map(st => `
    <div class="subtask-item ${st.completed ? 'completed' : ''}" data-subtask-id="${st.id}">
      <button class="subtask-checkbox ${st.completed ? 'checked' : ''}" data-toggle-subtask="${st.id}">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>
      <div class="subtask-text" contenteditable="true" data-edit-subtask="${st.id}">${escapeHtml(st.text)}</div>
      <button class="subtask-delete" data-delete-subtask="${st.id}" title="删除">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  `).join('');

  // 绑定事件
  subtasksList.querySelectorAll('[data-toggle-subtask]').forEach(btn => {
    btn.addEventListener('click', () => {
      const stId = btn.dataset.toggleSubtask;
      toggleSubtask(stId);
    });
  });

  subtasksList.querySelectorAll('[data-edit-subtask]').forEach(el => {
    el.addEventListener('blur', () => {
      const stId = el.dataset.editSubtask;
      const found = findCard(currentCardId);
      if (!found) return;
      const st = found.card.subtasks.find(s => s.id === stId);
      if (st) {
        st.text = el.textContent.trim() || st.text;
        saveData();
      }
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        el.blur();
      }
    });
  });

  subtasksList.querySelectorAll('[data-delete-subtask]').forEach(btn => {
    btn.addEventListener('click', () => {
      const stId = btn.dataset.deleteSubtask;
      deleteSubtask(stId);
    });
  });
}

function toggleSubtask(subtaskId) {
  const found = findCard(currentCardId);
  if (!found) return;
  const st = found.card.subtasks.find(s => s.id === subtaskId);
  if (!st) return;
  st.completed = !st.completed;
  saveData();
  renderSubtasks(found.card);
  updateCardSubtaskMeta(currentCardId);
}

function deleteSubtask(subtaskId) {
  const found = findCard(currentCardId);
  if (!found) return;
  found.card.subtasks = found.card.subtasks.filter(s => s.id !== subtaskId);
  saveData();
  renderSubtasks(found.card);
  updateCardSubtaskMeta(currentCardId);
}

function addSubtask() {
  const text = subtaskInput.value.trim();
  if (!text) return;
  const found = findCard(currentCardId);
  if (!found) return;
  if (!found.card.subtasks) found.card.subtasks = [];
  found.card.subtasks.push({
    id: uid('st'),
    text,
    completed: false
  });
  subtaskInput.value = '';
  saveData();
  renderSubtasks(found.card);
  updateCardSubtaskMeta(currentCardId);
}

document.getElementById('addSubtaskBtn').addEventListener('click', addSubtask);
subtaskInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    addSubtask();
  }
});

function updateCardSubtaskMeta(cardId) {
  const found = findCard(cardId);
  if (!found) return;
  const cardEl = document.querySelector(`.card[data-card-id="${cardId}"]`);
  if (!cardEl) return;

  const subtasks = found.card.subtasks || [];
  const total = subtasks.length;
  const completed = subtasks.filter(s => s.completed).length;

  let metaEl = cardEl.querySelector('.card-meta');

  if (total > 0) {
    if (metaEl) {
      metaEl.querySelector('.card-meta-item').lastChild.textContent = ` ${completed}/${total}`;
    } else {
      const metaHTML = `
        <div class="card-meta">
          <div class="card-meta-item">
            <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            ${completed}/${total}
          </div>
        </div>`;
      cardEl.insertAdjacentHTML('beforeend', metaHTML);
    }
  } else if (metaEl) {
    metaEl.remove();
  }
}

// ---------- 删除卡片 ----------
document.getElementById('deleteCardBtn').addEventListener('click', () => {
  if (!currentCardId) return;
  const found = findCard(currentCardId);
  if (!found) return;

  showConfirm(
    '删除卡片',
    `确定要删除卡片「${found.card.title}」吗？此操作不可撤销。`,
    () => {
      found.list.cards = found.list.cards.filter(c => c.id !== currentCardId);
      saveData();
      closeCardModal();
      setTimeout(render, 300);
    }
  );
});

const confirmOverlay = document.getElementById('confirmOverlay');
let confirmCallback = null;

function showConfirm(title, message, onOk) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMessage').textContent = message;
  confirmCallback = onOk;
  confirmOverlay.style.display = 'flex';

}

function hideConfirm() {

    confirmOverlay.style.display = 'none';

}

document.getElementById('confirmCancel').addEventListener('click', hideConfirm);
document.getElementById('confirmOk').addEventListener('click', () => {

// ---------- 主题切换 ----------
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
}

document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');

// ---------- 看板拖拽平移（左右皆可）----------
let isPanning = false;
let panStartX = 0;
let panStartScrollLeft = 0;

boardContainer.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  // 点击卡片 / 列表头 / 按钮 / 输入框 / 添加列表区时不触发平移，避免与拖拽冲突
  if (e.target.closest('.card')) return;
  if (e.target.closest('.list-header')) return;
  if (e.target.closest('button')) return;
  if (e.target.closest('input')) return;
  if (e.target.closest('.add-list-wrap')) return;

  isPanning = true;
  panStartX = e.clientX;
  panStartScrollLeft = boardContainer.scrollLeft;
  boardContainer.classList.add('grabbing');
  document.body.style.userSelect = 'none';

  const onPanMove = (ev) => {
    if (!isPanning) return;
    const dx = ev.clientX - panStartX;
    boardContainer.scrollLeft = panStartScrollLeft - dx;
  };
  const onPanUp = () => {
    isPanning = false;
    boardContainer.classList.remove('grabbing');
    document.body.style.userSelect = '';
    document.removeEventListener('mousemove', onPanMove);
    document.removeEventListener('mouseup', onPanUp);
  };

  document.addEventListener('mousemove', onPanMove);
  document.addEventListener('mouseup', onPanUp);
});

// ---------- 看板标题自定义 ----------
const boardTitleEl = document.getElementById('boardTitle');
const titleEditBtn = document.getElementById('titleEditBtn');

function applyBoardTitle() {
  const t = (state.boardTitle || '未命名看板').trim();
  boardTitleEl.textContent = t || '未命名看板';
}

titleEditBtn.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'board-title-input';
  input.value = state.boardTitle || '';

  const titleRow = boardTitleEl.parentElement;
  titleRow.replaceChild(input, boardTitleEl);
  titleEditBtn.style.display = 'none';
  input.focus();
  input.select();

  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    const val = commit ? (input.value.trim() || '未命名看板') : (state.boardTitle || '未命名看板');
    state.boardTitle = val;
    if (commit) saveData();
    boardTitleEl.textContent = val;
    if (input.parentElement) titleRow.replaceChild(boardTitleEl, input);
    titleEditBtn.style.display = '';
  };

  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
});

// ---------- 云端持久化（JsonLight，无后端）----------
// 说明：数据公开可读写、无鉴权；last-write-wins。仅作手动同步 / 分享用途。
const CLOUD_BASE = 'https://json.lighttools.net';
const CLOUD_KEY_STORE = 'kanban_cloud_key_v1';
const CLOUD_MODE_STORE = 'kanban_cloud_mode_v1'; // 'local' 表示用户选择纯本地模式

// 从分享链接或裸 key 中解析出 board key
function parseBoardKey(input) {
  if (!input) return null;
  const m = input.match(/board=([A-Za-z0-9_-]+)/);
  if (m) return m[1];
  const t = input.trim();
  if (/^[A-Za-z0-9_-]+$/.test(t)) return t;
  return null;
}

function getCloudKey() {
  const m = location.hash.match(/board=([A-Za-z0-9_-]+)/);
  if (m) {
    const k = m[1];
    try { localStorage.setItem(CLOUD_KEY_STORE, k); } catch (e) {}
    return k;
  }
  try { return localStorage.getItem(CLOUD_KEY_STORE); } catch (e) { return null; }
}

function setCloudKey(key) {
  try { localStorage.setItem(CLOUD_KEY_STORE, key); } catch (e) {}
  if (('#board=' + key) !== location.hash) {
    history.replaceState(null, '', '#board=' + key);
  }
}

function setSyncStatus(text) {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = text;
}

// 没有 key 就先去云端创建一个，并持久化到本地与网址 hash
async function ensureCloudKey() {
  let key = getCloudKey();
  if (key) return key;
  const res = await fetch(CLOUD_BASE + '/json/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ remark: 'kanban-board' })
  });
  const data = await res.json();
  if (data && data.code === 200 && data.data && data.data.jsonkey) {
    key = data.data.jsonkey;
    setCloudKey(key);
    return key;
  }
  throw new Error((data && data.message) ? data.message : '创建云端存储失败');
}

// 把整份 state 推送到云端
async function saveToCloud() {
  // 本地模式（无 key）下，上传前先询问，避免静默生成 key 并推送
  if (!getCloudKey() && localStorage.getItem(CLOUD_MODE_STORE) === 'local') {
    if (!confirm('当前为本地模式，是否上传到云端？\n这会自动生成分享 key 并保存当前看板。')) {
      setSyncStatus('本地');
      return false;
    }
  }
  setSyncStatus('同步中…');
  try {
    const key = await ensureCloudKey();
    const res = await fetch(CLOUD_BASE + '/json/' + key, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });
    const data = await res.json();
    if (data && data.code === 200) {
      // 一旦上传成功，即脱离本地模式（之后与云端 key 绑定，上传不再询问）
      try { localStorage.removeItem(CLOUD_MODE_STORE); } catch (e) {}
      setSyncStatus('已同步');
      return true;
    }
    throw new Error((data && data.message) ? data.message : '保存失败');
  } catch (err) {
    setSyncStatus('同步失败');
    console.error(err);
    alert('保存到云端失败：' + err.message);
    return false;
  }
}

// 从云端读取并校验结构
async function loadFromCloud(key) {
  const res = await fetch(CLOUD_BASE + '/json/' + key);
  if (!res.ok) throw new Error('读取失败 (HTTP ' + res.status + ')');
  const data = await res.json();
  if (data && data.lists && Array.isArray(data.lists)) {
    if (!data.boardTitle) data.boardTitle = '产品研发看板';
    return data;
  }
  throw new Error('云端数据格式不正确');
}

// 从云端拉取最新版本覆盖本机（带确认，避免误删本地未上传的改动）
async function pullFromCloud() {
  let key = getCloudKey();
  if (!key) {
    // 本地/无 key 模式：让用户输入分享链接或 key 来加入该云端看板
    const input = prompt('请输入要拉取的分享链接（或 key）：', '');
    if (!input) return;
    key = parseBoardKey(input);
    if (!key) { alert('无法从输入中识别分享链接或 key。'); return; }
    setCloudKey(key); // 采纳该 key，后续保存/拉取都绑定它
    try { localStorage.removeItem(CLOUD_MODE_STORE); } catch (e) {}
  }
  if (!confirm('将用云端最新版本覆盖本机当前的看板，本机未上传的改动会丢失。确定从云端拉取？')) {
    return;
  }
  setSyncStatus('同步中…');
  try {
    const cloudData = await loadFromCloud(key);
    state = cloudData;
    saveData();
    applyBoardTitle();
    render();
    setSyncStatus('已同步');
  } catch (e) {
    console.error(e);
    setSyncStatus('同步失败');
    alert('从云端拉取失败：' + e.message);
  }
}

// 生成并复制分享链接（先保存最新数据，再把 key 写进网址 hash）
async function copyShareLink() {
  try {
    const key = await ensureCloudKey();
    const ok = await saveToCloud();
    if (!ok) {
      alert('当前数据未能保存到云端，分享链接可能为空，请检查网络后重试。');
      return;
    }
    const url = location.origin + location.pathname + location.search + '#board=' + key;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(url);
      alert('分享链接已复制到剪贴板：\n' + url);
    } else {
      location.hash = 'board=' + key;
      prompt('复制此链接分享：', url);
    }
  } catch (err) {
    alert('生成分享链接失败：' + err.message);
  }
}

document.getElementById('syncBtn').addEventListener('click', () => { saveToCloud(); });
document.getElementById('pullBtn').addEventListener('click', () => { pullFromCloud(); });
document.getElementById('shareBtn').addEventListener('click', () => { copyShareLink(); });

// ---------- 首次打开「无 key」的数据来源选择 ----------
const cloudChoiceOverlay = document.getElementById('cloudChoiceOverlay');

function openCloudChoice() {
  cloudChoiceOverlay.style.display = 'flex';
  cloudChoiceOverlay.offsetHeight; // 触发重排以播放过渡
  cloudChoiceOverlay.classList.add('visible');
  document.getElementById('cloudChoiceBtns').style.display = '';
  document.getElementById('cloudLinkWrap').style.display = 'none';
  const inp = document.getElementById('cloudLinkInput');
  inp.value = '';
  document.getElementById('cloudLinkError').textContent = '';
  setTimeout(() => inp.focus(), 50);
}

function closeCloudChoice() {
  cloudChoiceOverlay.classList.remove('visible');
  setTimeout(() => { cloudChoiceOverlay.style.display = 'none'; }, 200);
}

function showCloudChoice() {
  openCloudChoice();
}

document.getElementById('choiceLocal').addEventListener('click', () => {
  try { localStorage.setItem(CLOUD_MODE_STORE, 'local'); } catch (e) {}
  setSyncStatus('本地');
  closeCloudChoice();
});

document.getElementById('choiceCloud').addEventListener('click', () => {
  document.getElementById('cloudChoiceBtns').style.display = 'none';
  document.getElementById('cloudLinkWrap').style.display = '';
  setTimeout(() => document.getElementById('cloudLinkInput').focus(), 50);
});

document.getElementById('cloudLinkBack').addEventListener('click', () => {
  document.getElementById('cloudLinkWrap').style.display = 'none';
  document.getElementById('cloudChoiceBtns').style.display = '';
});

document.getElementById('cloudLinkOk').addEventListener('click', async () => {
  const inp = document.getElementById('cloudLinkInput');
  const errEl = document.getElementById('cloudLinkError');
  const key = parseBoardKey(inp.value);
  if (!key) {
    errEl.textContent = '无法识别分享链接或 key，请检查后重试。';
    return;
  }
  setCloudKey(key);
  try { localStorage.removeItem(CLOUD_MODE_STORE); } catch (e) {}
  setSyncStatus('同步中…');
  closeCloudChoice();
  try {
    const cloudData = await loadFromCloud(key);
    state = cloudData;
    saveData();
    applyBoardTitle();
    render();
    setSyncStatus('已同步');
  } catch (e) {
    console.error(e);
    setSyncStatus('同步失败');
    alert('从云端加载失败：' + e.message);
  }
});

cloudChoiceOverlay.addEventListener('click', (e) => {
  if (e.target === cloudChoiceOverlay) closeCloudChoice();
});



// ---------- 初始化 ----------
initTheme();

// 打开时的数据来源决策：
// 1) 有 key（来自 #board= 或本地）→ 自动从云端加载
// 2) 无 key 但之前选过「仅用本地」→ 保持纯本地，不弹窗
// 3) 完全无 key 且无记录 → 弹出「选择数据来源」
(async () => {
  const k = getCloudKey();
  if (k) {
    setSyncStatus('同步中…');
    try {
      const cloudData = await loadFromCloud(k);
      state = cloudData;
      saveData(); // 同时存本地兜底
      setSyncStatus('已同步');
    } catch (e) {
      console.warn('云端加载失败，使用本地数据', e);
      setSyncStatus('本地');
    }
    applyBoardTitle();
    render();
    return;
  }

  if (localStorage.getItem(CLOUD_MODE_STORE) === 'local') {
    setSyncStatus('本地');
    applyBoardTitle();
    render();
    return;
  }

  // 完全没有 key 也没有选择记录：先渲染本地默认/已存数据，再弹窗询问
  applyBoardTitle();
  render();
  showCloudChoice();
})();

// 防止拖拽时选中文字
document.addEventListener('selectstart', (e) => {
  if (dragState.type) e.preventDefault();
});
</script>
