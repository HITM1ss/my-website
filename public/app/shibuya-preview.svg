<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shibuya Scramble Crossing Preview</title>
  <desc id="desc">A stylized city night view with neon signs and crosswalk.</desc>
  <defs>
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08112d" />
      <stop offset="100%" stop-color="#101c44" />
    </linearGradient>
    <linearGradient id="groundGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a2c" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>
    <linearGradient id="neonGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff79d1" />
      <stop offset="100%" stop-color="#5ad4ff" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#skyGradient)" />
  <rect y="560" width="1200" height="240" fill="url(#groundGradient)" />
  <g fill="#131a2f">
    <rect x="80" y="280" width="160" height="380" rx="16" />
    <rect x="280" y="260" width="180" height="400" rx="16" />
    <rect x="520" y="220" width="230" height="440" rx="16" />
    <rect x="810" y="240" width="170" height="420" rx="16" />
    <rect x="1010" y="260" width="150" height="400" rx="16" />
  </g>
  <g opacity="0.75">
    <rect x="110" y="300" width="120" height="20" rx="10" fill="#3e86ff" filter="url(#glow)" />
    <rect x="310" y="320" width="90" height="18" rx="9" fill="#ff4fd8" filter="url(#glow)" />
    <rect x="560" y="250" width="150" height="24" rx="12" fill="#4dffef" filter="url(#glow)" />
    <rect x="820" y="280" width="110" height="22" rx="11" fill="#ffbc39" filter="url(#glow)" />
    <rect x="1030" y="310" width="90" height="20" rx="10" fill="#8f6bff" filter="url(#glow)" />
  </g>
  <g fill="#dfe7ff" opacity="0.9">
    <path d="M 170 540 L 330 540 L 330 555 L 170 555 Z" />
    <path d="M 410 540 L 470 540 L 470 555 L 410 555 Z" />
    <path d="M 530 540 L 670 540 L 670 555 L 530 555 Z" />
    <path d="M 720 540 L 780 540 L 780 555 L 720 555 Z" />
  </g>
  <g fill="#94dbff" opacity="0.9">
    <path d="M 450 560 L 460 560 L 460 585 L 450 585 Z" />
    <path d="M 540 560 L 555 560 L 555 585 L 540 585 Z" />
    <path d="M 625 560 L 640 560 L 640 585 L 625 585 Z" />
  </g>
  <path d="M 190 540 C 220 510 290 500 390 500 C 510 500 610 520 690 544 C 740 560 820 568 880 560" fill="none" stroke="#7fd9ff" stroke-width="6" stroke-linecap="round" opacity="0.65" />
  <path d="M 160 600 C 210 570 300 558 380 560 C 470 562 580 590 660 616 C 720 632 820 638 900 620" fill="none" stroke="#ff8cf9" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <g fill="#ffffff" font-family="Inter, sans-serif" font-weight="700">
    <text x="90" y="90" font-size="58">SHIBUYA</text>
    <text x="90" y="150" font-size="36" fill="#b1d7ff" opacity="0.88">Scramble Crossing</text>
  </g>
  <g fill="#ffffff" opacity="0.4">
    <circle cx="980" cy="130" r="18" />
    <circle cx="1030" cy="160" r="12" />
    <circle cx="890" cy="95" r="8" />
  </g>
</svg>
