<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>渋谷スクランブル交差点</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #05050d; color: #f8f8ff; font-family: Inter, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #overlay { position: fixed; left: 24px; bottom: 24px; z-index: 10; pointer-events: none; }
    #overlay h1 { font-size: clamp(1.8rem, 2.6vw, 3.2rem); letter-spacing: 0.12em; line-height: 1.1; margin-bottom: 0.4rem; }
    #overlay p { color: rgba(255,255,255,0.72); font-size: 0.95rem; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #d8d8ff; background: rgba(0,0,0,0.65); z-index: 20; font-size: 1rem; }
  </style>
</head>
<body>
  <div id="loading">Loading Shibuya...</div>
  <canvas id="c"></canvas>
  <div id="overlay">
    <h1>渋谷スクランブル交差点</h1>
    <p>Shibuya Scramble Crossing · Tokyo</p>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060615);
  scene.fog = new THREE.FogExp2(0x060615, 0.00022);

  const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, 220);
  camera.position.set(-18, 20, -14);
  camera.lookAt(0, 0, 8);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.25;
  controls.minDistance = 14;
  controls.maxDistance = 50;
  controls.minPolarAngle = 0.2;
  controls.maxPolarAngle = Math.PI / 2.25;

  const ambient = new THREE.AmbientLight(0x2a2a45, 0.55);
  scene.add(ambient);

  const moon = new THREE.DirectionalLight(0x7788ff, 0.6);
  moon.position.set(26, 42, -18);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.near = 0.5;
  moon.shadow.camera.far = 160;
  moon.shadow.bias = -0.00025;
  scene.add(moon);

  const makeWindowTex = (rows, cols, color = '#ffcc88', facade = '#1a1a30') => {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = facade;
    ctx.fillRect(0, 0, size, size);
    const cw = size / cols;
    const ch = size / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() < 0.68) {
          ctx.globalAlpha = 0.35 + Math.random() * 0.55;
          ctx.fillStyle = color;
          ctx.fillRect(c * cw + cw * 0.12, r * ch + ch * 0.12, cw * 0.76, ch * 0.76);
        }
      }
    }
    ctx.globalAlpha = 1;
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
  };

  const createBuilding = (x, z, w, d, h, litColor = '#ffcc88') => {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = [
      new THREE.MeshStandardMaterial({ map: makeWindowTex(8, 4, litColor), roughness: 0.7, metalness: 0.18 }),
      new THREE.MeshStandardMaterial({ map: makeWindowTex(8, 4, litColor), roughness: 0.7, metalness: 0.18 }),
      new THREE.MeshStandardMaterial({ color: '#161624', roughness: 0.95 }),
      new THREE.MeshStandardMaterial({ color: '#161624', roughness: 0.95 }),
      new THREE.MeshStandardMaterial({ map: makeWindowTex(10, 5, litColor), roughness: 0.7, metalness: 0.18 }),
      new THREE.MeshStandardMaterial({ map: makeWindowTex(10, 5, litColor), roughness: 0.7, metalness: 0.18 }),
    ];
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, h / 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    return { mesh, w, d, h };
  };

  const createBillboard = (building, face, width, height, offsetY = 0) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(width, height), mat);
    plane.position.y = building.h * 0.57 + offsetY;
    if (face === 'south') { plane.position.z = building.d / 2 + 0.14; }
    if (face === 'north') { plane.position.z = -building.d / 2 - 0.14; plane.rotation.y = Math.PI; }
    if (face === 'east') { plane.position.x = building.w / 2 + 0.14; plane.rotation.y = -Math.PI / 2; }
    if (face === 'west') { plane.position.x = -building.w / 2 - 0.14; plane.rotation.y = Math.PI / 2; }
    scene.add(plane);
    return { canvas, tex, ctx };
  };

  const makeTextSign = (building, face, text, color, width, height, offsetY = 0) => {
    const { canvas, tex, ctx } = createBillboard(building, face, width, height, offsetY);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#060615';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.shadowColor = color;
    ctx.shadowBlur = 24;
    ctx.fillStyle = color;
    ctx.font = 'bold 64px Inter, system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    tex.needsUpdate = true;
    return { tex };
  };

  const createNeon = (x, y, z, color, intensity = 22) => {
    const light = new THREE.PointLight(color, intensity, 28);
    light.position.set(x, y, z);
    scene.add(light);
    return light;
  };

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(96, 96),
    new THREE.MeshStandardMaterial({ color: 0x101020, roughness: 0.8, metalness: 0.08 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.05;
  ground.receiveShadow = true;
  scene.add(ground);

  const buildings = [
    createBuilding(-10, -24, 10, 8, 42, '#ffcc88'),
    createBuilding(8, -22, 9, 7, 34, '#aaccff'),
    createBuilding(20, -20, 7, 6, 26, '#ffdd88'),
    createBuilding(-24, -20, 8, 7, 29, '#ccddff'),
    createBuilding(1, 24, 16, 10, 23, '#ffbb77'),
    createBuilding(25, -8, 8, 10, 37, '#aaddff'),
    createBuilding(-25, -6, 9, 9, 40, '#ffcc99'),
    createBuilding(23, 8, 7, 8, 29, '#ffeebb'),
  ];

  makeTextSign(buildings[0], 'south', 'SHIBUYA', '#ff55cc', 7, 2.5, -3);
  makeTextSign(buildings[1], 'south', 'TOKYO', '#55ccff', 4.5, 2, 3);
  makeTextSign(buildings[4], 'north', '109', '#ff4444', 3.5, 1.8, 2);
  makeTextSign(buildings[6], 'east', 'スクランブル', '#ff88cc', 5.5, 1.5, -2);

  createNeon(-10, 30, -20, 0xff55cc, 28);
  createNeon(10, 24, 24, 0xff4444, 32);
  createNeon(-23, 23, 8, 0xff4488, 22);
  createNeon(23, 21, 8, 0x00ff88, 22);

  const rainCount = 1800;
  const rainGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(rainCount * 3);
  const veloc = new Float32Array(rainCount);
  for (let i = 0; i < rainCount; i++) {
    positions[i * 3 + 0] = (Math.random() - 0.5) * 60;
    positions[i * 3 + 1] = Math.random() * 46 + 6;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 60;
    veloc[i] = 0.35 + Math.random() * 0.6;
  }
  rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const rain = new THREE.Points(
    rainGeo,
    new THREE.PointsMaterial({ color: 0xb8d8ff, size: 0.14, transparent: true, opacity: 0.55, depthWrite: false })
  );
  scene.add(rain);

  const crowdGeo = new THREE.BoxGeometry(0.28, 0.82, 0.28);
  const crowdMat = new THREE.MeshStandardMaterial({ color: 0x3d4a63, roughness: 0.53 });
  const crowd = new THREE.InstancedMesh(crowdGeo, crowdMat, 180);
  crowd.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(crowd);
  const crowdData = [];
  const tempMat = new THREE.Matrix4();
  const directions = [
    { dx: 1, dz: 0 }, { dx: -1, dz: 0 }, { dx: 0, dz: 1 }, { dx: 0, dz: -1 },
    { dx: 0.7, dz: 0.7 }, { dx: -0.7, dz: 0.7 }, { dx: 0.7, dz: -0.7 }, { dx: -0.7, dz: -0.7 },
  ];
  for (let i = 0; i < 180; i++) {
    const dir = directions[Math.floor(Math.random() * directions.length)];
    const px = dir.dx * (18 + Math.random() * 8);
    const pz = dir.dz * (18 + Math.random() * 8);
    crowdData.push({ x: px, z: pz, dx: dir.dx, dz: dir.dz, speed: 0.022 + Math.random() * 0.035 });
    tempMat.compose(new THREE.Vector3(px, 0.42, pz), new THREE.Quaternion(), new THREE.Vector3(1, 1, 1));
    crowd.setMatrixAt(i, tempMat);
  }
  crowd.instanceMatrix.needsUpdate = true;

  const fadeOut = document.getElementById('loading');
  const clock = new THREE.Clock();
  const animate = () => {
    const time = clock.getElapsedTime();
    controls.update();

    const pos = rainGeo.attributes.position.array;
    for (let i = 0; i < rainCount; i++) {
      pos[i * 3 + 1] -= veloc[i] * 0.52;
      if (pos[i * 3 + 1] < 0) {
        pos[i * 3 + 1] = 54;
        pos[i * 3 + 0] = (Math.random() - 0.5) * 58;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 58;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;

    for (let i = 0; i < 180; i++) {
      const person = crowdData[i];
      person.x += person.dx * person.speed;
      person.z += person.dz * person.speed;
      if (Math.abs(person.x) > 22 || Math.abs(person.z) > 22) {
        const dir = directions[Math.floor(Math.random() * directions.length)];
        person.dx = dir.dx;
        person.dz = dir.dz;
        person.x = dir.dx * 18;
        person.z = dir.dz * 18;
      }
      const bob = Math.sin(time * 2.3 + i) * 0.03;
      tempMat.compose(new THREE.Vector3(person.x, 0.42 + bob, person.z), new THREE.Quaternion(), new THREE.Vector3(1, 1, 1));
      crowd.setMatrixAt(i, tempMat);
    }
    crowd.instanceMatrix.needsUpdate = true;

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  };

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  window.setTimeout(() => {
    fadeOut.style.opacity = '0';
    window.setTimeout(() => fadeOut.remove(), 500);
  }, 600);

  animate();
  </script>
</body>
</html>
